spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: learning-assistant
  datasource:
    url: jdbc:postgresql://localhost:5432/learning_assistant
    username: learning
    password: learning
    hikari:
      initialization-fail-timeout: -1
  ai:
    model:
      chat: deepseek
      embedding: none
    vectorstore:
      type: none
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: deepseek-v4-flash
        thinking:
          type: disabled
    mcp:
      client:
        enabled: false

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
