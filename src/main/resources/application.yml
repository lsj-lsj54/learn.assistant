spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: learning-assistant
  datasource:
    url: ${DATASOURCE_URL}
    username: learning
    password: learning
    hikari:
      initialization-fail-timeout: -1
  ai:
    model:
      chat: deepseek
      embedding: ollama
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: bge-m3
    vectorstore:
      type: pgvector
      pgvector:
        initialize-schema: true
        dimensions: 1024
        max-document-batch-size: 100
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: deepseek-v4-flash
        thinking:
          type: disabled
    mcp:
      client:
        enabled: false
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

learn:
  chat:
    system-prompt: |
      你是学习助手，用简洁的中文回答。记住同一段对话里用户说过的信息，并在后续问题中使用。
      一件事需要多个工具时，在同一次回答里按顺序调用。用户要下载文件时，先搜索拿到直链，再调用下载工具。PDF 保存到 pdf 目录，其他资源保存到 res。保存路径必须是「分类/文件名」。先根据内容选择已有分类，例如威龙放进游戏，泰山放进风景；没有合适分类就新建一个简短中文分类。不要只把链接留给用户，也不要改去抓取网页。
      不要根据以前的失败判断工具不可用。每次都重新调用工具，只有这次工具返回未配置时才能说密钥没有配置。
    max-memory-messages: 20
  paths:
    pdf-dir: src/main/resources/pdf
    download-dir: res
  tools:
    pdf-font: C:/Windows/Fonts/simhei.ttf
    bocha-api-key: ${BOCHA_API_KEY:}
    scrape-max-chars: ${LEARN_TOOLS_SCRAPE_MAX_CHARS:8000}
    read-max-chars: ${LEARN_TOOLS_READ_MAX_CHARS:100000}
  rag:
    retrieval:
      similarity-threshold: 0.5
      top-k: 4
      rewrite-min-length: 24
      target-language: chinese
      allow-empty-context: ${LEARN_RAG_ALLOW_EMPTY_CONTEXT:false}
    chunk:
      chunk-size: 500
      min-chunk-size-chars: 100
      min-chunk-length-to-embed: 5
      max-num-chunks: 10000
      keep-separator: true
      punctuation: "。！？；\n.!?;"
    batch:
      max-token-count: 8192
      reserve-percentage: 0.1
      encoding: CL100K_BASE

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
