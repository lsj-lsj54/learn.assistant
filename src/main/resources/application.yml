spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: learning-assistant
  mvc:
    async:
      request-timeout: 10m
  datasource:
    url: ${DATASOURCE_URL}
    username: learning
    password: learning
    hikari:
      initialization-fail-timeout: -1
  ai:
    model:
      chat: deepseek
      embedding: ollama
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: bge-m3
    vectorstore:
      type: pgvector
      pgvector:
        initialize-schema: true
        dimensions: 1024
        max-document-batch-size: 100
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: deepseek-v4-flash
        thinking:
          type: disabled
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

learn:
  chat:
    max-memory-messages: 20
  paths:
    pdf-dir: src/main/resources/pdf
    download-dir: res
  tools:
    pdf-font: ${LEARN_TOOLS_PDF_FONT:}
    bocha-api-key: ${BOCHA_API_KEY:}
    scrape-max-chars: ${LEARN_TOOLS_SCRAPE_MAX_CHARS:8000}
    read-max-chars: ${LEARN_TOOLS_READ_MAX_CHARS:100000}
  rag:
    retrieval:
      similarity-threshold: 0.5
      top-k: 4
      rewrite-min-length: 24
      target-language: chinese
      allow-empty-context: ${LEARN_RAG_ALLOW_EMPTY_CONTEXT:false}
    chunk:
      chunk-size: 500
      min-chunk-size-chars: 100
      min-chunk-length-to-embed: 5
      max-num-chunks: 10000
      keep-separator: true
      punctuation: "。！？；\n.!?;"
    batch:
      max-token-count: 8192
      reserve-percentage: 0.1
      encoding: CL100K_BASE

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

knife4j:
  enable: true
