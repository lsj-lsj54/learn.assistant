spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: learning-assistant
  datasource:
    url: ${DATASOURCE_URL}
    username: learning
    password: learning
    hikari:
      initialization-fail-timeout: -1
  ai:
    model:
      chat: deepseek
      embedding: ollama
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: bge-m3
    vectorstore:
      type: pgvector
      pgvector:
        initialize-schema: true
        dimensions: 1024
        max-document-batch-size: 100
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: deepseek-v4-flash
        thinking:
          type: disabled
    mcp:
      client:
        enabled: false
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

learn:
  chat:
    system-prompt: "你是学习助手，用简洁的中文回答。记住同一段对话里用户说过的信息，并在后续问题中使用。"
    max-memory-messages: 20
  paths:
    pdf-dir: src/main/resources/pdf
    download-dir: res
  tools:
    pdf-font: C:/Windows/Fonts/simhei.ttf
  rag:
    retrieval:
      similarity-threshold: 0.5
      top-k: 4
      rewrite-min-length: 24
      target-language: chinese
      allow-empty-context: ${LEARN_RAG_ALLOW_EMPTY_CONTEXT:false}
    chunk:
      chunk-size: 500
      min-chunk-size-chars: 100
      min-chunk-length-to-embed: 5
      max-num-chunks: 10000
      keep-separator: true
      punctuation: "。！？；\n.!?;"
    batch:
      max-token-count: 8192
      reserve-percentage: 0.1
      encoding: CL100K_BASE

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
