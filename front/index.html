<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <button class="new-chat" id="newChat" type="button">开启新对话</button>
        <div class="chat-list" id="chatList"></div>
        <section class="library" id="library">
            <div class="library-head">
                <button class="library-toggle" id="libraryToggle" type="button" aria-expanded="true">资料库</button>
                <button class="library-upload" id="uploadPdf" type="button">上传 PDF</button>
            </div>
            <input id="pdfFile" type="file" accept="application/pdf,.pdf" hidden>
            <div class="library-body" id="libraryBody">
                <div class="library-list" id="libraryList"></div>
                <p class="library-result" id="libraryResult"></p>
                <button class="import-pdf" id="importPdf" type="button">重新导入</button>
                <button class="clear-vectors" id="clearVectors" type="button">清空资料库</button>
            </div>
        </section>
        <dl class="settings" id="settings">
            <div><dt>抓取上限</dt><dd id="scrapeMax">—</dd></div>
            <div><dt>读文件上限</dt><dd id="readMax">—</dd></div>
            <div><dt>对话记忆</dt><dd id="memoryMax">—</dd></div>
            <div><dt>空上下文</dt><dd id="emptyContext">—</dd></div>
        </dl>
    </aside>
    <main class="main">
        <header class="topbar">
            <button class="menu" id="menu" type="button" aria-label="打开会话列表">菜单</button>
            <span>学习助手</span>
        </header>
        <section class="stage" id="stage">
            <div class="welcome" id="welcome">
                <h1>今天有什么可以帮你的？</h1>
            </div>
            <div class="messages" id="messages" hidden></div>
        </section>
        <form class="composer" id="composer">
            <div class="modes">
                <button class="mode active" id="modeStudy" type="button">查资料</button>
                <button class="mode" id="modeTask" type="button">办事情</button>
            </div>
            <div class="composer-row">
                <textarea id="input" rows="1" placeholder="给学习助手发送消息"></textarea>
                <button class="send" id="send" type="submit" aria-label="发送">↑</button>
            </div>
        </form>
        <p class="hint" id="hint"></p>
    </main>
    <script src="app.js"></script>
</body>
</html>
